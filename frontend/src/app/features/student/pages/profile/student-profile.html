<div class="profile-container">

  <div class="profile-header">
    <div>
      <h1>Mon profil étudiant</h1>
      <p>Gérez vos informations personnelles et universitaires.</p>
    </div>
  </div>

  <div *ngIf="loading" class="message">
    Chargement du profil...
  </div>

  <form *ngIf="!loading" (ngSubmit)="saveProfile()">

    <section class="profile-card">
      <h2>Informations personnelles</h2>

      <div class="form-grid">

        <div class="form-group">
          <label>Nom complet</label>
          <input [value]="profile.fullName" disabled>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input [value]="profile.email" disabled>
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="profile.phone">
        </div>

      </div>
    </section>

    <section class="profile-card">
      <h2>Informations universitaires</h2>

      <div class="form-grid">

        <div class="form-group">
          <label>Université / Établissement</label>
          <input
            name="university"
            [(ngModel)]="profile.university"
            placeholder="Votre établissement">
        </div>

        <div class="form-group">
          <label>Spécialité</label>
          <input
            name="specialization"
            [(ngModel)]="profile.specialization"
            placeholder="Votre spécialité">
        </div>

        <div class="form-group">
          <label>Niveau d'études</label>
          <select
            name="studyLevel"
            [(ngModel)]="profile.studyLevel">

            <option value="">Choisir un niveau</option>
            <option value="L1">Licence 1</option>
            <option value="L2">Licence 2</option>
            <option value="L3">Licence 3</option>
            <option value="M1">Master 1</option>
            <option value="M2">Master 2</option>

          </select>
        </div>

      </div>
    </section>

    <section class="profile-card">
      <h2>Documents et réseaux professionnels</h2>

      <div class="form-group">
        <label>URL du CV</label>
        <input
          type="url"
          name="cvUrl"
          [(ngModel)]="profile.cvUrl"
          placeholder="https://...">
      </div>

      <div class="form-group">
        <label>LinkedIn</label>
        <input
          type="url"
          name="linkedinUrl"
          [(ngModel)]="profile.linkedinUrl"
          placeholder="https://linkedin.com/in/...">
      </div>

      <div class="form-group">
        <label>GitHub</label>
        <input
          type="url"
          name="githubUrl"
          [(ngModel)]="profile.githubUrl"
          placeholder="https://github.com/...">
      </div>

    </section>

    <div *ngIf="successMessage" class="success">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="saving">
      {{ saving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
    </button>

  </form>
</div>
