
<div class="register-page">

  <header class="register-header">
    <a routerLink="/" class="brand">
      <span class="brand-icon">S</span>
      Stage<span>Connect</span>
    </a>

    <p>Déjà membre ? <a routerLink="/login">Se connecter</a></p>
  </header>

  <main class="register-container">

    <div class="register-card">

      <div class="card-heading">
        <span class="eyebrow">REJOIGNEZ STAGECONNECT</span>
        <h1>Créez votre compte.</h1>
        <p>Quelques informations pour commencer votre expérience.</p>
      </div>

      <form (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label for="role">Type de compte</label>
          <select id="role" name="role" [(ngModel)]="role">
            <option value="STUDENT">Étudiant</option>
            <option value="COMPANY">Entreprise</option>
            <option value="TEACHER">Enseignant</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input id="firstName" name="firstName"
              [(ngModel)]="firstName" placeholder="Votre prénom" required />
          </div>

          <div class="form-group">
            <label for="lastName">Nom</label>
            <input id="lastName" name="lastName"
              [(ngModel)]="lastName" placeholder="Votre nom" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Adresse email</label>
          <input id="email" type="email" name="email"
            [(ngModel)]="email" placeholder="exemple@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password" [(ngModel)]="password"
            placeholder="8 caractères minimum" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input id="confirmPassword" type="password"
            name="confirmPassword" [(ngModel)]="confirmPassword"
            placeholder="Confirmez votre mot de passe" required />
        </div>

        <label class="password-toggle">
          <input type="checkbox" [(ngModel)]="showPassword"
            name="showPassword" />
          Afficher le mot de passe
        </label>

        <p class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>

        <p class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </p>

        <button type="submit" class="submit-btn">
          Créer mon compte →
        </button>

      </form>

      <p class="terms">
        En créant votre compte, vous acceptez les conditions
        d'utilisation de la plateforme.
      </p>

    </div>

  </main>
</div>
